<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventario</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #1c1b1b;
        --panel: #f7e9d5;
        --side: #4caf3f;
        --side-t: #fff;
        --row: #f4c95d;
        --row-alt: #fff6e6;
        --row-draft: #f3dfc3;
        --form: #ecc230;
        --ink: #2a2b6b;
        --muted: #8a7f72;
        --accent: #e8762b;
        --btn: #4caf3f;
        --btn-t: #fff;
        --field: #fff6e6;
        --danger: #e5484d;
        --line: #2a2b6b;
      }
      :root[data-theme="dark"] {
        --page: #060b18;
        --panel: #0f1a33;
        --side: #16294f;
        --side-t: #dbe6ff;
        --row: #1d3366;
        --row-alt: #14244a;
        --row-draft: #101d3c;
        --form: #173061;
        --ink: #e6ecff;
        --muted: #7f93c2;
        --accent: #5b9bff;
        --btn: #3b7cff;
        --btn-t: #fff;
        --field: #0c1630;
        --danger: #ff6b72;
        --line: #5b9bff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: "Lexend", system-ui, sans-serif;
        min-height: 100vh;
        padding: 16px;
        transition: background 0.25s;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .app {
        max-width: 1100px;
        margin: auto;
        display: grid;
        gap: 16px;
        grid-template-columns: 1.5fr 1fr;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 16px;
      }
      .list-panel {
        grid-column: 1;
      }
      .form-panel {
        grid-column: 2;
        background: var(--form);
        position: sticky;
        top: 16px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
        font-weight: 700;
      }
      .sub {
        font-size: 0.8rem;
        font-weight: 500;
        margin: 2px 0 12px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .layout {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 14px;
      }
      .side {
        background: var(--side);
        color: var(--side-t);
        border-radius: 10px;
        padding: 12px;
        font-size: 0.8rem;
        align-self: start;
      }
      .side h3 {
        margin: 10px 0 6px;
        font-size: 0.9rem;
      }
      .side h3:first-child {
        margin-top: 0;
      }
      .pills {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .pill {
        background: transparent;
        border: 2px solid var(--side-t);
        color: var(--side-t);
        border-radius: 8px;
        padding: 2px 0;
        font-size: 0.75rem;
        font-weight: 500;
      }
      .pill.on {
        background: var(--side-t);
        color: var(--ink);
      }
      :root[data-theme="dark"] .pill.on {
        color: #0b1225;
      }
      .side select,
      .side input {
        width: 100%;
        border: 2px solid var(--side-t);
        background: transparent;
        color: var(--side-t);
        border-radius: 8px;
        padding: 4px 6px;
        font-size: 0.75rem;
        margin-bottom: 5px;
      }
      .side option {
        color: #000;
      }
      .side input::placeholder {
        color: var(--side-t);
        opacity: 0.7;
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tools input {
        flex: 1;
        min-width: 0;
        background: var(--field);
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      .btn {
        background: var(--btn);
        color: var(--btn-t);
        border: 0;
        border-radius: 8px;
        padding: 6px 14px;
        font-weight: 700;
        font-size: 0.8rem;
      }
      .btn.alt {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--line);
      }
      .btn.danger {
        background: var(--danger);
        color: #fff;
      }

      .btnn.danger {
        border: 0;
        border-radius: 8px;
        background: #8360e1;
        color: #fff;
        padding: 6px 14px;
        font-weight: 700;
        font-size: 0.8rem;
        text-decoration: none;
      }
      .icon-btn {
        background: var(--row);
        border: 0;
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 1rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .chip {
        background: var(--row);
        border: 0;
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 0.78rem;
        font-weight: 700;
        border-bottom: 3px solid rgba(0, 0, 0, 0.18);
      }
      .chip.on {
        outline: 3px solid var(--accent);
      }
      .chip.warn {
        background: var(--danger);
        color: #fff;
      }
      .items {
        display: grid;
        gap: 8px;
      }
      .items.grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .item {
        display: grid;
        grid-template-columns: 44px 1fr auto auto 34px;
        gap: 10px;
        align-items: center;
        background: var(--row);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .item.sel {
        border-color: var(--accent);
      }
      .item.s-inactive {
        opacity: 0.55;
      }
      .item.s-draft {
        background: var(--row-draft);
        opacity: 0.85;
      }
      .thumb {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #fff6;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        overflow: hidden;
      }
      .thumb img,
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .name {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .name small {
        display: block;
        font-weight: 400;
        font-size: 0.7rem;
        color: var(--muted);
      }
      .price {
        font-size: 0.72rem;
        line-height: 1.3;
      }
      .price b {
        display: block;
        font-size: 0.8rem;
      }
      .badge {
        font-size: 0.65rem;
        border-radius: 6px;
        padding: 1px 6px;
        background: var(--danger);
        color: #fff;
        margin-left: 4px;
        font-weight: 500;
      }
      .grid .item {
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "t e" "n n" "p p" "q q";
      }
      .grid .item .thumb {
        grid-area: t;
        width: 48px;
        height: 48px;
      }
      .grid .item .icon-btn {
        grid-area: e;
        justify-self: end;
      }
      .grid .item .name {
        grid-area: n;
      }
      .grid .item .price {
        grid-area: p;
      }
      .empty {
        text-align: center;
        padding: 24px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .form-panel h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .drop {
        border: 3px dotted var(--ink);
        border-radius: 12px;
        height: 130px;
        display: grid;
        place-items: center;
        text-align: center;
        cursor: pointer;
        background: var(--field);
        overflow: hidden;
        font-size: 0.8rem;
        margin-bottom: 10px;
      }
      .drop span {
        font-size: 2.2rem;
        display: block;
        line-height: 1;
      }
      .preview {
        width: 100%;
        height: 100%;
      }
      .f {
        display: grid;
        gap: 8px;
      }
      .f label {
        font-size: 0.72rem;
        font-weight: 500;
        display: grid;
        gap: 2px;
      }
      .f input,
      .f select {
        background: var(--field);
        border: 0;
        border-bottom: 2px solid var(--line);
        border-radius: 6px 6px 0 0;
        padding: 6px 8px;
        width: 100%;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .theme {
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .bar {
        max-width: 1100px;
        margin: 0 auto 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
      }
      :root[data-theme="dark"] .bar {
        color: var(--ink);
      }
      .bar strong {
        font-size: 1.1rem;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--panel);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.8rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .toast.show {
        opacity: 1;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .form-panel {
          grid-column: 1;
          position: static;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .side {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 12px;
        }
      }
      @media (max-width: 520px) {
        .item {
          grid-template-columns: 40px 1fr auto 34px;
        }
        .item .price:nth-of-type(1) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>📦 Mi Inventario</strong>
      <button class="theme" id="theme" aria-label="Cambiar tema">
        🌙 Modo oscuro
      </button>
    </div>

    <div class="app">
      <section class="panel list-panel">
        <div class="top">
          <div>
            <h1>PRODUCTOS</h1>
            <div class="sub" id="total"></div>
          </div>
        </div>
        <div class="tools">
          <input
            id="q"
            type="search"
            placeholder="Buscar..."
            aria-label="Buscar"
          />
          <button
            class="icon-btn"
            id="vList"
            title="Lista"
            aria-label="Vista lista"
          >
            ☰
          </button>
          <button
            class="icon-btn"
            id="vGrid"
            title="Cuadrícula"
            aria-label="Vista cuadrícula"
          >
            ▦
          </button>
          <button class="btn" id="add">Agregar</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="layout">
          <aside class="side">
            <h3>Status</h3>
            <div class="pills" id="status"></div>
            <h3>Ordenar por</h3>
            <select id="sort">
              <option value="az">Alfabeto A-Z</option>
              <option value="za">Alfabeto Z-A</option>
              <option value="pAsc">Precio ↑</option>
              <option value="pDesc">Precio ↓</option>
              <option value="stock">Menor stock</option>
            </select>
            <h3>Categoría</h3>
            <select id="cat"></select>
            <h3>Precio</h3>
            <input id="pmin" type="number" min="0" placeholder="C$ Mín" />
            <input id="pmax" type="number" min="0" placeholder="C$ Máx" />
          </aside>
          <div class="items" id="items"></div>
        </div>
      </section>

      <section class="panel form-panel">
        <h2><span id="ftitle">Agregar producto</span></h2>
        <label class="drop" for="file" id="drop">
          <div id="dropInner"><span>＋</span>Selecciona tu imagen</div>
        </label>
        <input type="file" id="file" accept="image/*" hidden />
        <div class="f">
          <label>Nombre<input id="fName" maxlength="40" /></label>
          <div class="row2">
            <label>Stock<input id="fStock" type="number" min="0" /></label>
            <label
              >Estado
              <select id="fStatus">
                <option value="active">Activo</option>
                <option value="inactive">Inactivo</option>
                <option value="draft">Borrador</option>
              </select>
            </label>
          </div>
          <div class="row2">
            <label
              >Precio compra (C$)<input
                id="fBuy"
                type="number"
                min="0"
                step="0.01"
            /></label>
            <label
              >Precio venta (C$)<input
                id="fSell"
                type="number"
                min="0"
                step="0.01"
            /></label>
          </div>
          <div class="row2">
            <label
              >Categoría<input id="fCat" list="cats" placeholder="Ej. Lácteos"
            /></label>
            <label>Vence<input id="fExp" type="date" /></label>
          </div>
          <datalist id="cats"></datalist>
          <label>Otros<input id="fNote" maxlength="80" /></label>
        </div>
        <div class="actions">
          <button class="btn" id="save">Guardar</button>
          <button class="btn alt" id="clear">Limpiar</button>
          <button class="btn danger" id="del" hidden>Eliminar</button>
          <a class="btnn danger" href="Laesquina.php">Atrás</a>
        </div>
      </section>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const KEY = "inv.products",
        TKEY = "inv.theme";
      const STATUS = {
        all: "Todos",
        active: "Activos",
        inactive: "Inact",
        draft: "Draft",
      };
      const STATUS_LABEL = {
        active: "Activo",
        inactive: "Inactivo",
        draft: "Borrador",
      };
      const EMOJI = {
        cereales: "🥣",
        lacteos: "🥛",
        café: "☕",
        cafe: "☕",
        fruta: "🍓",
        bebidas: "🍷",
      };

      const day = (n) => {
        const d = new Date();
        d.setDate(d.getDate() + n);
        return d.toISOString().slice(0, 10);
      };
      const seed = [
        {
          id: 1,
          name: "Cereal",
          cat: "Cereales",
          buy: 20,
          sell: 25,
          stock: 40,
          status: "active",
          exp: day(200),
          note: "",
          img: "",
        },
        {
          id: 2,
          name: "Café",
          cat: "Otra categoría",
          buy: 25,
          sell: 30,
          stock: 25,
          status: "active",
          exp: day(300),
          note: "",
          img: "",
        },
        {
          id: 3,
          name: "Lácteo xd",
          cat: "Lácteos",
          buy: 30,
          sell: 40,
          stock: 12,
          status: "active",
          exp: day(9),
          note: "Refrigerar",
          img: "",
        },
        {
          id: 4,
          name: "Fruta procesada",
          cat: "Otra categoría",
          buy: 100,
          sell: 150,
          stock: 8,
          status: "active",
          exp: day(25),
          note: "",
          img: "",
        },
        {
          id: 5,
          name: "Rompope",
          cat: "Otra categoría",
          buy: 60,
          sell: 70,
          stock: 0,
          status: "inactive",
          exp: "",
          note: "",
          img: "",
        },
        {
          id: 6,
          name: "Vino de uva",
          cat: "Otra categoría",
          buy: 89.76,
          sell: 96,
          stock: 5,
          status: "draft",
          exp: "",
          note: "",
          img: "",
        },
      ];

      let products = load();
      let ui = {
        status: "all",
        cat: "Todos",
        chip: null,
        view: "list",
        sel: null,
        img: "",
      };

      function load() {
        try {
          const d = JSON.parse(localStorage.getItem(KEY));
          if (Array.isArray(d)) return d;
        } catch (e) {}
        return seed;
      }
      function persist() {
        try {
          localStorage.setItem(KEY, JSON.stringify(products));
        } catch (e) {
          toast("No se pudo guardar (almacenamiento lleno)");
        }
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (n) =>
        "C$ " +
        Number(n).toLocaleString("es-NI", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const norm = (s) =>
        s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      const soon = (p) => {
        if (!p.exp) return false;
        const d = (new Date(p.exp) - new Date()) / 864e5;
        return d >= 0 && d <= 30;
      };
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.remove("show"), 1800);
      }
      function icon(p) {
        if (p.img) return `<img src="${p.img}" alt="">`;
        const k = norm(p.cat || "");
        return EMOJI[k] || EMOJI[norm(p.name || "")] || "📦";
      }

      /* ---------- Filters ---------- */
      function filtered() {
        const q = norm($("#q").value.trim());
        const min = parseFloat($("#pmin").value),
          max = parseFloat($("#pmax").value);
        let list = products.filter(
          (p) =>
            (ui.status === "all" || p.status === ui.status) &&
            (ui.cat === "Todos" || p.cat === ui.cat) &&
            (!q || norm(p.name + " " + p.cat + " " + p.note).includes(q)) &&
            (isNaN(min) || p.sell >= min) &&
            (isNaN(max) || p.sell <= max),
        );
        if (ui.chip === "soon") list = list.filter(soon);
        else if (ui.chip === "active")
          list = list.filter((p) => p.status === "active");
        else if (ui.chip) list = list.filter((p) => p.cat === ui.chip);
        const s = $("#sort").value;
        const by = {
          az: (a, b) => a.name.localeCompare(b.name),
          za: (a, b) => b.name.localeCompare(a.name),
          pAsc: (a, b) => a.sell - b.sell,
          pDesc: (a, b) => b.sell - a.sell,
          stock: (a, b) => a.stock - b.stock,
        };
        return list.sort(by[s]);
      }

      /* ---------- Render ---------- */
      function render() {
        const cats = [
          ...new Set(products.map((p) => p.cat).filter(Boolean)),
        ].sort();
        $("#cat").innerHTML = ["Todos", ...cats]
          .map(
            (c) =>
              `<option ${c === ui.cat ? "selected" : ""}>${esc(c)}</option>`,
          )
          .join("");
        $("#cats").innerHTML = cats
          .map((c) => `<option value="${esc(c)}">`)
          .join("");
        $("#status").innerHTML = Object.entries(STATUS)
          .map(
            ([k, v]) =>
              `<button class="pill ${ui.status === k ? "on" : ""}" data-s="${k}">${v}</button>`,
          )
          .join("");
        const chips = [["active", "Activos"], ...cats.map((c) => [c, c])];
        $("#chips").innerHTML =
          chips
            .map(
              ([k, v]) =>
                `<button class="chip ${ui.chip === k ? "on" : ""}" data-c="${esc(k)}">${esc(v)}</button>`,
            )
            .join("") +
          `<button class="chip warn ${ui.chip === "soon" ? "on" : ""}" data-c="soon">Próximos a vencer</button>`;

        const list = filtered();
        $("#total").textContent =
          `Total: ${products.length} producto${products.length === 1 ? "" : "s"}` +
          (list.length !== products.length
            ? ` · mostrando ${list.length}`
            : "");
        const box = $("#items");
        box.className = "items" + (ui.view === "grid" ? " grid" : "");
        box.innerHTML = list.length
          ? list
              .map(
                (p) => `
    <div class="item s-${p.status} ${ui.sel === p.id ? "sel" : ""}" data-id="${p.id}">
      <div class="thumb">${icon(p)}</div>
      <div class="name">${esc(p.name)}${soon(p) ? '<span class="badge">vencido</span>' : ""}
        <small>${esc(p.cat)} · Stock ${p.stock}</small></div>
      <div class="price">Precio compra:<b>${money(p.buy)}</b></div>
      <div class="price">Precio venta<b>${money(p.sell)}</b></div>
      <button class="icon-btn" data-edit="${p.id}" aria-label="Editar ${esc(p.name)}">✏️</button>
    </div>`,
              )
              .join("")
          : '<div class="empty">No hay productos con estos filtros. Prueba limpiar la búsqueda o agrega uno nuevo.</div>';
      }

      /* ---------- Form ---------- */
      function setImg(src) {
        ui.img = src || "";
        $("#dropInner").innerHTML = ui.img
          ? `<div class="preview"><img src="${ui.img}" alt="Vista previa"></div>`
          : "<span>＋</span>Selecciona tu imagen";
      }
      function fill(p) {
        ui.sel = p ? p.id : null;
        $("#ftitle").textContent = p ? "Editar producto" : "Agregar producto";
        $("#fName").value = p?.name ?? "";
        $("#fStock").value = p?.stock ?? "";
        $("#fStatus").value = p?.status ?? "active";
        $("#fBuy").value = p?.buy ?? "";
        $("#fSell").value = p?.sell ?? "";
        $("#fCat").value = p?.cat ?? "";
        $("#fExp").value = p?.exp ?? "";
        $("#fNote").value = p?.note ?? "";
        setImg(p?.img);
        $("#del").hidden = !p;
        render();
      }
      function save() {
        const name = $("#fName").value.trim();
        if (!name) {
          toast("Escribe el nombre del producto");
          $("#fName").focus();
          return;
        }
        const sell = parseFloat($("#fSell").value) || 0,
          buy = parseFloat($("#fBuy").value) || 0;
        const data = {
          name,
          cat: $("#fCat").value.trim() || "Sin categoría",
          buy,
          sell,
          stock: parseInt($("#fStock").value) || 0,
          status: $("#fStatus").value,
          exp: $("#fExp").value,
          note: $("#fNote").value.trim(),
          img: ui.img,
        };
        if (ui.sel) {
          Object.assign(
            products.find((p) => p.id === ui.sel),
            data,
          );
          toast("Producto actualizado");
        } else {
          const id = Date.now();
          products.push({ id, ...data });
          ui.sel = id;
          toast("Producto agregado");
        }
        persist();
        fill(products.find((p) => p.id === ui.sel));
      }
      function resize(file) {
        const r = new FileReader();
        r.onload = (e) => {
          const im = new Image();
          im.onload = () => {
            const s = Math.min(1, 200 / Math.max(im.width, im.height));
            const c = document.createElement("canvas");
            c.width = im.width * s;
            c.height = im.height * s;
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            setImg(c.toDataURL("image/jpeg", 0.8));
          };
          im.src = e.target.result;
        };
        r.readAsDataURL(file);
      }

      /* ---------- Events ---------- */
      $("#status").onclick = (e) => {
        const b = e.target.closest("[data-s]");
        if (b) {
          ui.status = b.dataset.s;
          render();
        }
      };
      $("#chips").onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (b) {
          ui.chip = ui.chip === b.dataset.c ? null : b.dataset.c;
          render();
        }
      };
      $("#cat").onchange = (e) => {
        ui.cat = e.target.value;
        render();
      };
      ["#q", "#sort", "#pmin", "#pmax"].forEach((s) =>
        $(s).addEventListener("input", render),
      );
      $("#vList").onclick = () => {
        ui.view = "list";
        render();
      };
      $("#vGrid").onclick = () => {
        ui.view = "grid";
        render();
      };
      $("#add").onclick = () => {
        fill(null);
        $("#fName").focus();
      };
      $("#clear").onclick = () => fill(null);
      $("#save").onclick = save;
      $("#del").onclick = () => {
        const p = products.find((p) => p.id === ui.sel);
        if (p && confirm(`¿Eliminar "${p.name}"?`)) {
          products = products.filter((x) => x.id !== p.id);
          persist();
          fill(null);
          toast("Producto eliminado");
        }
      };
      $("#items").onclick = (e) => {
        const row = e.target.closest(".item");
        if (row) fill(products.find((p) => p.id === +row.dataset.id));
      };
      $("#file").onchange = (e) => {
        if (e.target.files[0]) resize(e.target.files[0]);
        e.target.value = "";
      };
      $("#drop").ondragover = (e) => e.preventDefault();
      $("#drop").ondrop = (e) => {
        e.preventDefault();
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith("image/")) resize(f);
      };
      $(".form-panel").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.tagName === "INPUT") save();
      });

      /* ---------- Theme ---------- */
      function theme(t) {
        document.documentElement.dataset.theme = t;
        $("#theme").textContent =
          t === "dark" ? "☀️ Modo claro" : "🌙 Modo oscuro";
        try {
          localStorage.setItem(TKEY, t);
        } catch (e) {}
      }
      $("#theme").onclick = () =>
        theme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        );
      let saved = null;
      try {
        saved = localStorage.getItem(TKEY);
      } catch (e) {}
      theme(
        saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"),
      );

      render();
    </script>
  </body>
</html>
